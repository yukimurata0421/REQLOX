name: Runtime checks and UI deployment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQLOX_RUN_NATIVE_TESTS: '0'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[knowledge,test]'
      - run: python scripts/coverage_check.py --suite unit --output coverage-report --seconds 120
      - name: Retain coverage and skipped-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage-report/
          retention-days: 7
      - run: python -m pip wheel --no-deps . -w /tmp/reqlox-wheel
      - run: python -m reqlox inventory --root examples/repository
      - run: python -m reqlox run --target examples/targets/target.json --all --dry-run
      - name: Check the installed Target CLI outside the checkout
        run: |
          python -m venv /tmp/reqlox-installed
          /tmp/reqlox-installed/bin/python -m pip install /tmp/reqlox-wheel/reqlox-*.whl
          cd /tmp
          /tmp/reqlox-installed/bin/reqlox run --target "$GITHUB_WORKSPACE/examples/targets/target.json" --all --dry-run

  package:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build the tested public runtime and fixed browser assets
        run: |
          python -m pip install '.[knowledge]' wheel
          python -m pip wheel --no-deps . -w /tmp/reqlox-wheel
          METHOD_SHA=$(sha256sum infra/gcp/runtime_rollout.py | cut -d ' ' -f 1)
          mkdir -p /tmp/reqlox-bundle
          python scripts/cloud_release.py --wheel /tmp/reqlox-wheel/reqlox-*.whl --output-dir /tmp/reqlox-bundle/release --rollout-method-sha256 "$METHOD_SHA"
          python scripts/cloud_web_assets.py --output-dir /tmp/reqlox-bundle/assets > /tmp/reqlox-bundle/assets.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-ui-${{ github.sha }}
          path: |
            /tmp/reqlox-bundle/release/cloud-release.tar.gz
            /tmp/reqlox-bundle/assets
            /tmp/reqlox-bundle/assets.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [unit, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'yukimurata0421/REQLOX' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: reqlox-gcp-ui-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-ui-${{ github.sha }}
          path: /tmp/reqlox-bundle
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: reqlox
          workload_identity_provider: projects/159522719541/locations/global/workloadIdentityPools/reqlox-github/providers/main
          service_account: reqlox-github-deploy@reqlox.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Deploy once and verify the inherited execution stop
        run: python scripts/cloud_ci_deploy.py --commit "$GITHUB_SHA" --bundle /tmp/reqlox-bundle --output deployment-artifacts
      - name: Retain the safe deployment result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-${{ github.sha }}
          path: deployment-artifacts/result.json
          retention-days: 14
          if-no-files-found: warn
